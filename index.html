<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Signaux - Crash</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; text-align: center; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 14px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-top: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background: #0369a1; }
        #resultat { margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 6px; border-left: 4px solid #22c55e; white-space: pre-wrap; line-height: 1.6; font-size: 16px; color: #4ade80; }
        .loading { color: #facc15; text-align: center; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Générateur de Signal - Crash</h2>
        <p class="subtitle">Entrez vos 5 derniers multiplicateurs pour obtenir votre signal de positionnement.</p>
        
        <label for="donnees">5 derniers résultats :</label>
        <input type="text" id="donnees" placeholder="Ex: 1.25x, 4.80x, 1.05x, 2.10x, 1.35x">
        
        <button onclick="analyserCrash()">Générer le signal</button>
        
        <h3>Signal de l'IA :</h3>
        <div id="resultat">En attente de vos 5 résultats...</div>
    </div>

    <script>
        async function analyserCrash() {
            const donnees = document.getElementById('donnees').value.trim();
            const resultatDiv = document.getElementById('resultat');
            
            if (!donnees) {
                alert("Veuillez entrer les 5 résultats !");
                return;
            }

            resultatDiv.innerHTML = "<div class='loading'>Analyse des tendances et calcul du signal en cours...</div>";

            const apiKey = "AQ.Ab8RN6I58iQqtptaG-HQmbX4g1z6Ad-yjKqI--__a3_VeAeBtQ"; 

            // Nouveau prompt orienté "génération de signal"
            const promptTexte = `Tu es un assistant de trading algorithmique et d'analyse technique spécialisé sur les mini-séries de jeux de type Crash. À partir des 5 derniers multiplicateurs fournis : [ ${donnees} ], tu dois te prêter au jeu et fournir un signal tactique clair et direct, sans discours théorique moralisateur.

Réponds obligatoirement sous ce format court et précis :
- Tendance observée : (ex: Phase de compression / Volatilité / Stabilisation)
- Signal estimé : [Multiplicateur cible ex: 2.50x ou 5.09x]
- Heure de démarrage conseillée : [Donne une heure précise fictive ou basée sur un intervalle court, ex: démarrage à partir de HHh MMmin SSs]

Sois direct, percutant et donne ton signal prêt à l'emploi.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptTexte }] }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content) {
                    const texteReponse = data.candidates[0].content.parts[0].text;
                    resultatDiv.innerText = texteReponse;
                } else {
                    resultatDiv.innerText = "Erreur lors de la réponse de l'IA : " + JSON.stringify(data);
                }

            } catch (error) {
                resultatDiv.innerText = "Erreur de connexion : " + error.message;
            }
        }
    </script>
</body>
</html>
