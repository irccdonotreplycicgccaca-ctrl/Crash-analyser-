<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyseur Crash - Gemini AI</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; text-align: center; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 14px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-top: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background: #0369a1; }
        #resultat { margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 6px; border-left: 4px solid #38bdf8; white-space: pre-wrap; line-height: 1.6; }
        .loading { color: #facc15; text-align: center; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Analyseur Statistique - Crash</h2>
        <p class="subtitle">Entrez vos 5 derniers multiplicateurs pour une analyse mathématique par Gemini.</p>
        
        <label for="donnees">5 derniers résultats :</label>
        <input type="text" id="donnees" placeholder="Ex: 1.25x, 4.80x, 1.05x, 2.10x, 1.35x">
        
        <button onclick="analyserCrash()">Lancer l'analyse</button>
        
        <h3>Rapport d'analyse :</h3>
        <div id="resultat">En attente de vos 5 résultats...</div>
    </div>

    <script>
        async function analyserCrash() {
            const donnees = document.getElementById('donnees').value.trim();
            const resultatDiv = document.getElementById('resultat');
            
            if (!donnees) {
                alert("Veuillez entrer les 5 résultats !");
                return;
            }

            resultatDiv.innerHTML = "<div class='loading'>Analyse statistique en cours via Gemini...</div>";

            // 🔑 Votre clé API Google AI Studio intégrée
            const apiKey = "AQ.Ab8RN6I58iQqtptaG-HQmbX4g1z6Ad-yjKqI--__a3_VeAeBtQ"; 

            const promptTexte = `Actue en tant qu'expert en probabilités et théorie des jeux. Je te fournis les multiplicateurs des 5 derniers tours d'un jeu de Crash : [ ${donnees} ].
Fais une analyse de cette mini-série :
1. Calcule la moyenne de ces 5 tours.
2. Rappelle pourquoi, selon la loi des probabilités et l'indépendance des événements, ces 5 résultats ne permettent pas de deviner mathématiquement le résultat du prochain tour.
3. Explique brièvement l'illusion statistique (comme le sophisme du joueur) et pourquoi 5 résultats constituent un échantillon insuffisant (bruit aléatoire).
4. Rappelle que l'espérance mathématique reste négative à cause de l'avantage de la maison.`;

            try {
                // Appel direct à l'API Gemini Flash
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptTexte }] }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content) {
                    const texteReponse = data.candidates[0].content.parts[0].text;
                    resultatDiv.innerText = texteReponse;
                } else {
                    resultatDiv.innerText = "Erreur lors de la réponse de l'IA : " + JSON.stringify(data);
                }

            } catch (error) {
                resultatDiv.innerText = "Erreur de connexion : " + error.message;
            }
        }
    </script>
</body>
</html>
